goals:
  - id: G1
    name: Bridge the debugging gap
    statement: >
      Bridge the gap between CDP tools (raw browser JS, no helpers) and
      Playwright tests (full helpers but browser closes on failure) so that
      developers and AI agents can run project-specific helper code against
      live browsers.
    tags: [core, debugging]
    maps_to: []
    refs:
      - file: docs/design.md
        identifier: Why
        role: defines
      - file: README.md
        identifier: Integration with Playwright Tests
        role: defines

  - id: G2
    name: AI-agent-first browser debugging
    statement: >
      Provide a scriptable, non-interactive CLI that AI coding agents can use
      to debug browser-based test failures programmatically. The primary user
      is Claude Code and similar AI agents, not humans in a REPL.
    tags: [core, ai-agents]
    maps_to: [project:G1]
    refs:
      - file: docs/design.md
        identifier: What This Is
        role: defines

  - id: G3
    name: Zero-translation copy-paste promise
    statement: >
      Debugging scripts written with playlite must be directly copy-pasteable
      into Playwright test files with no translation. The same page object,
      await patterns, and lib helpers work in both contexts.
    tags: [core, dx]
    maps_to: [project:G1]

  - id: G4
    name: Project helper injection
    statement: >
      Load project-specific test helper libraries (the same classes and
      functions used in Playwright tests) into the debugging scope, so
      debugging scripts can use the exact same helpers as test code.
    tags: [core, libs]
    maps_to: [project:G1, project:G3]
    refs:
      - file: README.md
        identifier: Lib System (the key feature)
        role: defines
      - file: docs/usage.md
        identifier: Lib System
        role: defines
      - file: docs/design.md
        identifier: Lib System
        role: defines

values:
  - id: V1
    name: Simplicity over abstraction
    statement: >
      Keep the tool minimal. Prefer straightforward code that is easy to
      debug (e.g., generating a readable temp file) over clever abstractions
      (e.g., Node vm module, dynamic import hooks). The codebase should be
      small enough that reading the source is practical.
    tags: [architecture]
    maps_to: []

  - id: V2
    name: Actionable error messages
    statement: >
      Every error message must tell the user what went wrong AND what to do
      about it. Never show a raw stack trace or cryptic message when a
      human-readable alternative is possible.
    tags: [dx, errors]
    maps_to: []
    refs:
      - file: docs/usage.md
        identifier: Error Reference
        role: defines

  - id: V3
    name: Host project compatibility
    statement: >
      Work seamlessly with the host project's TypeScript configuration,
      path aliases, and dependency versions. Libs and scripts should use
      the same imports as the project's test files.
    tags: [compatibility, libs]
    maps_to: []
    refs:
      - file: docs/design.md
        identifier: Path Alias Resolution
        role: defines

  - id: V4
    name: Predictable output conventions
    statement: >
      Machine-readable data goes to stdout. Human-readable status goes to
      stderr. Errors go to stderr. This enables reliable piping and
      programmatic consumption by AI agents.
    tags: [cli, output]
    maps_to: []
    refs:
      - file: docs/usage.md
        identifier: Output Conventions
        role: defines

principles:
  - id: P1
    name: Not a REPL, not a test runner, not a recorder
    statement: >
      playlite is a debugging tool. It does not provide interactive mode
      (AI agents send commands, not keystrokes), test execution (use
      Playwright for that), or codegen recording. These are intentional
      omissions, not TODOs.
    tags: [scope, non-goals]
    maps_to: [project:G2, project:V1]
    refs:
      - file: docs/architecture.md
        identifier: Non-Goals
        role: defines
      - file: docs/design.md
        identifier: Non-Goals
        role: defines

  - id: P2
    name: No bundled browsers
    statement: >
      Use playwright-core (not playwright) to avoid downloading browser
      binaries. playlite connects to whatever Chromium the user already
      has running. This keeps the package lightweight and avoids version
      conflicts.
    tags: [architecture, dependencies]
    maps_to: [project:G1, project:V1]

  - id: P3
    name: Subprocess isolation for script execution
    statement: >
      User scripts run in a separate tsx subprocess, not in the playlite
      process. This provides loader isolation (tsx's TS loader needs
      process-startup registration), dependency isolation (playwright-core
      from playlite's node_modules, project imports from host tsconfig),
      and debuggability (the temp wrapper is a readable .ts file).
    tags: [architecture, runner]
    maps_to: [project:G3, project:V1, project:V3]

  - id: P4
    name: Walk-up directory discovery
    statement: >
      Find .playlite/ and tsconfig.json by walking up from CWD to the
      filesystem root, mirroring how git finds .git/. This allows monorepos
      to have one .playlite/ at the root or per-subproject overrides.
    tags: [architecture, config]
    maps_to: [project:G4, project:V3]
    refs:
      - file: docs/architecture.md
        identifier: .playlite/ Directory Walk
        role: defines

  - id: P5
    name: Lib exports as bare globals
    statement: >
      Lib factory return values are assigned to globalThis so user code
      references them as bare identifiers (e.g., helper instead of
      libs.helper). This matches how the same objects would appear in a
      Playwright test file, supporting the copy-paste promise.
    tags: [libs, dx]
    maps_to: [project:G3, project:G4, project:V3]
    refs:
      - file: docs/architecture.md
        identifier: Lib Loading as globalThis Assignment
        role: defines

decisions:
  - id: D1
    name: Temp wrapper approach for script execution
    status: active
    statement: >
      Generate a self-contained temporary .ts file that connects to the
      browser, loads libs, and inlines user code inside an async IIFE,
      then execute it via tsx subprocess. Chosen over Node vm module and
      dynamic import hooks for simplicity and debuggability.
    rationale: >
      Loader isolation: tsx's TS loader must be registered at process
      startup. Dependency isolation: playwright-core resolves from
      playlite's node_modules while project imports resolve from host
      tsconfig. Simplicity: the temp file is readable and debuggable.
    tags: [architecture, runner]
    maps_to: [project:P3, project:G3, project:V1]
    considered:
      Node vm module:
        description: Run user code in a Node.js VM context within the playlite process.
        rationale: Rejected. Complex to set up TypeScript loader correctly, and dependency isolation is difficult.
      Dynamic import hooks:
        description: Register custom import hooks for the user's code at runtime.
        rationale: Rejected. Fragile because tsx's loader needs to be registered at process startup, not at runtime.
    refs:
      - file: src/runner.ts
        identifier: generateWrapper
        role: implements
      - file: src/runner.ts
        identifier: executeWrapper
        role: implements
      - file: docs/architecture.md
        identifier: The Temp Wrapper Approach (runner.ts)
        role: defines
      - file: docs/architecture.md
        identifier: Script execution (run, eval --lib)
        role: defines
      - file: docs/design.md
        identifier: Script Execution
        role: defines

  - id: D2
    name: tsx as sole TypeScript compiler
    status: active
    statement: >
      Use tsx for all TypeScript compilation needs: tsImport() for
      programmatic dynamic imports (config, libs in simple commands) and
      tsx binary for subprocess execution of temp wrappers. The design doc's
      esbuild fallback was not implemented.
    rationale: >
      tsx handles both programmatic (tsImport from tsx/esm/api) and CLI
      use cases, supports tsconfig paths natively, and is fast enough for
      debugging scripts. One compiler simplifies the dependency graph.
    tags: [architecture, dependencies]
    maps_to: [project:G3, project:V1]
    considered:
      esbuild fallback:
        description: Use esbuild as a fallback TypeScript compiler when tsx is unavailable.
        rationale: Rejected during implementation. tsx covers all use cases and adding a second compiler would add complexity with no practical benefit.
    refs:
      - file: src/loader.ts
        identifier: importTs
        role: implements
      - file: src/runner.ts
        identifier: findTsxBin
        role: implements
      - file: docs/architecture.md
        identifier: tsx for TypeScript (loader.ts)
        role: defines

  - id: D3
    name: commander for CLI framework
    status: active
    statement: >
      Use commander for CLI argument parsing and subcommand routing.
      Lightweight, well-known, handles subcommands and option parsing
      without heavy framework overhead.
    rationale: >
      The design doc considered minimal process.argv parsing but noted
      commander as an option if complexity warranted it. The 8 subcommands
      with varied options justified a lightweight framework.
    tags: [cli, dependencies]
    maps_to: [project:G2, project:V1]
    considered:
      Manual process.argv parsing:
        description: Parse arguments manually without a library.
        rationale: Rejected. 8 subcommands with varied options makes this error-prone and tedious.
    refs:
      - file: src/cli.ts
        identifier: program
        role: implements
      - file: docs/architecture.md
        identifier: Tech Stack
        role: defines
      - file: docs/design.md
        identifier: Tech Stack
        role: defines

  - id: D4
    name: __name polyfill for page.evaluate compatibility
    status: active
    statement: >
      Inject a no-op __name polyfill into the browser page context before
      running user code. This works around esbuild/tsx's keepNames
      transform which wraps functions with __name() calls that break when
      serialized into page.evaluate().
    rationale: >
      tsx uses esbuild internally, which applies keepNames. When Playwright
      serializes functions for page.evaluate(), the __name helper is not
      available in the browser context, causing ReferenceError. The no-op
      polyfill (fn => fn) is transparent to users.
    tags: [compatibility, browser]
    maps_to: [project:G3, project:V3]
    refs:
      - file: src/runner.ts
        identifier: generateWrapper
        role: implements
      - file: docs/architecture.md
        identifier: "`__name` polyfill"
        role: defines
      - file: docs/usage.md
        identifier: "`__name` polyfill"
        role: defines

  - id: D5
    name: Wrapper tsconfig extending host tsconfig
    status: active
    statement: >
      Generate a temporary tsconfig.json that extends the host project's
      tsconfig with ESM-compatible overrides (module ES2022,
      moduleResolution bundler). This prevents CJS/ESM conflicts when
      the host project uses module commonjs.
    rationale: >
      Host projects often use module commonjs in their tsconfig, which
      conflicts with the ESM imports in the generated wrapper. Extending
      preserves all path aliases and baseUrl while overriding only the
      module settings.
    tags: [compatibility, runner]
    maps_to: [project:G3, project:V3]
    refs:
      - file: src/runner.ts
        identifier: executeWrapper
        role: implements
      - file: docs/architecture.md
        identifier: Wrapper tsconfig
        role: defines
      - file: docs/usage.md
        identifier: Wrapper tsconfig
        role: defines

  - id: D6
    name: CWD set to project root during script execution
    status: active
    statement: >
      The tsx subprocess CWD is set to the project root (parent of
      .playlite/) rather than the directory where playlite was invoked.
      This ensures relative path resolution and tools like dotenv.config()
      find the correct files.
    rationale: >
      Users may invoke playlite from any subdirectory. Setting CWD to
      project root provides consistent behavior regardless of invocation
      location, matching how most project tools behave.
    tags: [runner, dx]
    maps_to: [project:G2, project:V3]
    refs:
      - file: src/runner.ts
        identifier: executeWrapper
        role: implements
      - file: docs/architecture.md
        identifier: CWD during script execution
        role: defines
      - file: docs/usage.md
        identifier: CWD during script execution
        role: defines

  - id: D7
    name: Import hoisting via pragmatic heuristic
    status: active
    statement: >
      User script import statements are extracted and placed at the top
      of the generated wrapper (outside the async IIFE) using a
      line-scanning heuristic, not a full parser. Handles standard
      import patterns and multi-line imports.
    rationale: >
      User code is inlined inside an async IIFE for top-level await
      support, but static imports must be at module top level. A full
      AST parser would add complexity and dependencies. The heuristic
      handles the common patterns that debugging scripts use.
    tags: [runner, architecture]
    maps_to: [project:G3, project:V1]
    considered:
      Full AST parser:
        description: Use a TypeScript AST parser to precisely extract imports.
        rationale: Rejected. Adds a dependency and complexity for a use case where simple line scanning is sufficient.
    refs:
      - file: src/runner.ts
        identifier: splitImports
        role: implements
      - file: docs/architecture.md
        identifier: Import Hoisting (splitImports in runner.ts)
        role: defines

  - id: D8
    name: Dual execution modes for eval
    status: active
    statement: >
      eval without --lib runs in the browser via page.evaluate() (raw
      browser JS, like the DevTools console). eval with --lib runs in a
      Node.js subprocess via the temp wrapper with Playwright page object
      and lib helpers in scope. These are fundamentally different execution
      environments.
    rationale: >
      Sometimes you want raw browser JS for DOM inspection or ExtJS widget
      queries. Sometimes you want Playwright APIs and project helpers. The
      --lib flag is a natural switch: if you need helpers, you need --lib;
      if you don't, you're doing raw browser work.
    tags: [cli, eval]
    maps_to: [project:G1, project:G4, project:V1]
    refs:
      - file: src/commands/eval.ts
        identifier: evalCommand
        role: implements
      - file: docs/architecture.md
        identifier: Two Execution Modes for eval
        role: defines
      - file: docs/usage.md
        identifier: "`eval`"
        role: defines

  - id: D9
    name: Config libs prepended to CLI --lib flags
    status: active
    statement: >
      Libs specified in .playlite/config.ts are prepended to any --lib
      flags given on the command line. This allows projects to set standard
      libs once in config and skip --lib on every invocation, while still
      allowing CLI overrides.
    rationale: >
      Most projects have a primary lib that is used in nearly every
      debugging session. Requiring --lib on every invocation is tedious.
      Config libs as defaults, with CLI flags appended, gives the best
      of both worlds.
    tags: [config, libs]
    maps_to: [project:G4, project:V3]
    refs:
      - file: src/cli.ts
        identifier: program
        role: implements
      - file: docs/architecture.md
        identifier: Configuration
        role: defines
      - file: docs/usage.md
        identifier: Configuration
        role: defines
      - file: docs/usage.md
        identifier: "`.playlite/config.ts`"
        role: defines
      - file: docs/design.md
        identifier: Configuration
        role: defines
      - file: docs/design.md
        identifier: "`.playlite/config.ts`"
        role: defines

  - id: D10
    name: Environment variables not implemented
    status: deferred
    statement: >
      The design doc specified PLAYLITE_PORT, PLAYLITE_PROFILE, and
      PLAYLITE_CONFIG environment variables. These were not implemented.
      Configuration is handled solely via .playlite/config.ts and CLI flags.
    rationale: >
      The config file and CLI flags provide sufficient configurability.
      Environment variables would add a third configuration source with
      precedence ambiguity. Keeping two sources (config file + CLI) is
      simpler.
    tags: [config]
    maps_to: [project:G2, project:V1]
    refs:
      - file: docs/design.md
        identifier: Environment Variables
        role: defines

  - id: D11
    name: 1-based tab indexing
    status: active
    statement: >
      Tab indices displayed by playlite tabs and used by --tab are 1-based,
      matching human expectations. The design doc originally described using
      CDP target IDs; the implementation uses array indices instead.
    rationale: >
      1-based indexing matches the displayed output (tab 1 is --tab 1).
      CDP target IDs are opaque strings that are harder for both humans
      and AI agents to work with.
    tags: [cli, tabs]
    maps_to: [project:G2, project:V2]
    considered:
      CDP target IDs:
        description: Use CDP target IDs as tab identifiers.
        rationale: Rejected. Opaque strings are harder for AI agents and humans to work with than simple 1-based indices.
    refs:
      - file: src/browser.ts
        identifier: selectPage
        role: implements
      - file: src/browser.ts
        identifier: listTabs
        role: implements
      - file: docs/usage.md
        identifier: Tab Selection
        role: defines
      - file: docs/design.md
        identifier: Tab Selection Logic
        role: defines

  - id: D12
    name: Stdin support for run command
    status: active
    statement: >
      playlite run accepts input from stdin via explicit - marker or
      auto-detection when stdin is not a TTY. This enables piping and
      heredocs for quick one-off scripts without creating files.
    rationale: >
      AI agents often generate scripts dynamically. Requiring a temp
      file for every script adds friction. Stdin support lets agents
      pipe code directly.
    tags: [cli, run]
    maps_to: [project:G2, project:V1]
    refs:
      - file: src/commands/run.ts
        identifier: run
        role: implements
      - file: docs/usage.md
        identifier: "`run`"
        role: defines

  - id: D13
    name: No test suite
    status: superseded
    statement: >
      The project currently has no automated tests. The package.json test
      script is a stub. Testing has been done manually against live browsers.
    rationale: >
      Time pressure — the project was implemented rapidly and shipped
      without tests. This was not a deliberate design choice. Testing
      against live browsers was the primary validation method during
      initial development. This is a significant gap for AI-agent-driven
      development. Superseded by D14.
    tags: [testing, gap]
    maps_to: [project:G2, project:V1]
    refs:
      - file: package.json
        identifier: scripts
        role: defines

  - id: D14
    name: "node:test as test framework"
    status: active
    statement: >
      Use Node.js built-in test runner (node:test + node:assert) for unit
      tests. Tests run via tsx (already a dependency) with the command
      node --import tsx/esm --test src/**/*.test.ts. Initial coverage
      targets pure functions in runner.ts and config.ts.
    rationale: >
      Zero additional dependencies — node:test is built into Node 18+
      (satisfies C1). Aligns with V1 (simplicity over abstraction).
      vitest was considered but rejected: it pulls a large dependency
      tree (vite, esbuild, etc.) whose value-add (HMR, watch mode,
      browser mode) is irrelevant for pure function unit tests. The
      test targets are straightforward enough that describe/it/assert
      is sufficient.
    tags: [testing, dependencies]
    maps_to: [project:G2, project:V1]
    considered:
      vitest:
        description: Modern test runner with Vite-based HMR and browser mode.
        rationale: >
          Rejected. Large dependency tree adds complexity for no practical
          benefit — test targets are pure functions, not components needing
          HMR or browser environments.
      jest:
        description: Popular test framework with large ecosystem.
        rationale: >
          Rejected. Poor ESM support, requires additional transforms for
          TypeScript, and the project already has tsx which handles TS
          execution natively.
    refs:
      - file: package.json
        identifier: scripts
        role: defines
      - file: src/runner.test.ts
        identifier: runner-unit-tests
        role: implements
      - file: src/config.test.ts
        identifier: config-unit-tests
        role: implements

  - id: D15
    name: Config files are CLI input, not output sources
    status: active
    statement: >
      .playlite/config.ts is loaded in playlite's process via tsImport
      and runs at startup for every command. Code in this file (and
      anything it imports) must not write to stdout; playlite reserves
      stdout for machine-readable output. The contract applies to
      imports as well — if a config loads dotenv or any library that
      prints on init, the user must suppress its output (e.g.,
      dotenv.config({ quiet: true })).
    rationale: >
      Playlite does not patch user dependencies or intercept their
      stdout — doing so would set a hostile precedent against V1
      (simplicity) and V3 (host project compatibility, where the user
      owns their config). Documenting the contract on the user side
      keeps runtime behavior predictable and protects V4
      (machine-readable stdout) for AI agents (G2) consuming command
      output.
    tags: [config, output]
    maps_to: [project:V1, project:V3, project:V4, project:G2]
    considered:
      Monkey-patch dotenv before user config loads:
        description: Wrap or replace dotenv.config inside playlite so user calls become silent automatically.
        rationale: >
          Rejected. Invasive — modifies a third-party library in the
          user's process. Sets a precedent against V1 simplicity and
          would accumulate over time as new noisy libraries appear.
      Suppress stdout during config import:
        description: Redirect process stdout while loading .playlite/config.ts so any prints are swallowed.
        rationale: >
          Rejected. Magic behavior — users would rely on it without
          realizing. Brittle if a config legitimately produces output,
          and harder to debug when expected output disappears.
      Subprocess-isolate config loading:
        description: Load .playlite/config.ts in a child process and read back the resolved config over IPC.
        rationale: >
          Rejected. Architectural overkill for a contract that
          documents cleanly. Costs debuggability and startup time.
    refs:
      - file: docs/usage.md
        identifier: Writing .playlite/config.ts
        role: defines
      - file: src/loader.ts
        identifier: importTs
        role: implements
      - file: src/config.ts
        identifier: loadConfig
        role: implements

  - id: D16
    name: "Accept --format json as alias for --json"
    status: active
    statement: >
      Commands that produce JSON output (eval, tabs) accept --format <fmt>
      as well as --json. The --format flag is restricted to value json via
      Option.choices. The two surfaces are equivalent; --json remains the
      canonical short form.
    rationale: >
      Aligns CLI ergonomics with gh, kubectl, az, jq conventions that AI
      agents and humans default to. V2 + G2.
    tags: [cli, eval, tabs]
    maps_to: [project:V2, project:G2, project:V4]
    considered:
      Customize unknown-option error to hint:
        description: >
          Use program.exitOverride() to intercept and emit a hint when
          the unknown option is --format.
        rationale: >
          Rejected. Less discoverable, more code, doesn't surface in --help.
      Reject --format outright:
        description: >
          Keep the current behavior where --format is rejected as unknown.
        rationale: >
          Rejected. Perpetuates the friction reported in issue #2.
    refs:
      - file: src/cli.ts
        identifier: program
        role: implements
      - file: docs/usage.md
        identifier: eval
        role: defines
      - file: docs/usage.md
        identifier: tabs
        role: defines

  - id: D17
    name: Connect uses exit code, not stdout, as the success signal
    status: active
    statement: >
      playlite connect returns exit 0 iff a CDP connection succeeds.
      Stdout content is informational only; scripts (including AI-agent
      poll loops) must use the exit code ($?), not parse stdout, for
      control flow. The success message format may change without notice.
    rationale: >
      Codifies existing behavior so future-us can't accidentally break
      it. Real consumer sessions have written grep-based polls that
      short-circuit because failure messages contain the port number
      (e.g., grep -q 'Connected\|9223' matches on the failure path);
      the only stable signal is the exit code. Maps to V4 (predictable
      output — status belongs on stderr, not stdout), G2 (AI-agent-first;
      agents need a contract they can rely on without reading source),
      and V2 (actionable contract — the documented signal is the one
      that actually works).
    tags: [cli, output, ai-agents]
    maps_to: [project:V2, project:V4, project:G2]
    considered:
      Stable success-message contract on stdout:
        description: >
          Promise that the success line ("Connected to browser on port N
          (M tabs)") is parseable and stable, so consumers can grep it.
        rationale: >
          Rejected. Contradicts V4 — status messages belong on stderr,
          not stdout, and locking the message format restricts future
          UX changes (e.g., adding tab summaries). The exit code is the
          right signal; stdout is for machine-readable data, not status.
      Add --quiet flag:
        description: >
          Add an opt-in --quiet flag that suppresses stdout/stderr so
          poll loops don't have to redirect manually.
        rationale: >
          Deferred to a separate ticket (per #004 Out of Scope). The
          existing >/dev/null 2>&1 idiom is universally understood and
          adds no CLI surface; a flag is only worth adding if a real
          consumer asks.
    refs:
      - file: src/commands/connect.ts
        identifier: connect
        role: implements
      - file: docs/usage.md
        identifier: Polling pattern
        role: defines
      - file: README.md
        identifier: connect
        role: defines

  - id: D18
    name: "Accept -e/--expression and -c/--code as aliases for positional eval code"
    status: active
    statement: >
      playlite eval accepts code via the positional argument (canonical),
      or via -e/--expression or -c/--code. Exactly one form must be used
      per invocation; passing more than one is an error. The positional
      remains canonical for documentation and backward compatibility with
      D8/D12.
    rationale: >
      AI agents and humans coming from node -e, python -c, etc. reach for
      these flags first. Adding aliases collapses friction without
      removing the positional. Maps to V2 (actionable errors), G2
      (AI-agent-first), V1 (still small).
    tags: [cli, eval, ai-agents]
    maps_to: [project:V2, project:G2, project:V1]
    considered:
      Error hint only (no aliases):
        description: >
          Customize the unknown-option error to hint that code is
          positional, without adding -e/-c flags.
        rationale: >
          Rejected. Keeps friction — the user still has to retype the
          command using the positional form. Pays the cost of an error
          path without solving the actual problem.
      "-e only (drop -c)":
        description: >
          Add only -e/--expression, omit -c/--code.
        rationale: >
          Rejected. Both are common upstream conventions (-e matches
          node -e, -c matches python -c); the marginal cost is one
          option line, and either feels native depending on the user's
          background.
      Replace positional with required -e:
        description: >
          Remove the positional argument and require -e/--expression.
        rationale: >
          Rejected. Breaks every existing caller and contradicts D8's
          surface stability.
      Symmetric treatment for run:
        description: >
          Mirror the -e/-c aliases on the run command for symmetry.
        rationale: >
          Rejected. D12 (stdin support) already provides the equivalent
          ergonomic for run. Adding flags to run would create a third
          way to pass code without ergonomic gain and risks confusion
          about when stdin vs flag wins.
    refs:
      - file: src/cli.ts
        identifier: program
        role: implements
      - file: src/commands/eval.ts
        identifier: evalCommand
        role: implements
      - file: docs/usage.md
        identifier: eval
        role: defines

